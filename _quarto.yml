project:
  type: website
  render:
    - "*.qmd"
    - "recherche/**/*.qmd"
    - "enseignement/**/*.qmd"
    - "conferences/**/*.qmd"
    - "!gabarits/*.qmd"

website:
  title: "Portfolio académique"
  site-url: "https://elodiebourgeois-portfolio.share.connect.posit.cloud/"
  navbar:
    left:
      - href: index.qmd
        text: Accueil
      - href: profil.qmd
        text: Profil
      - href: recherche/index.qmd
        text: Recherche
      # - href: enseignement/index.qmd
      #   text: Enseignement
      # - href: conferences/index.qmd
      #   text: Conférences
    right:
      - icon: github
        href: https://github.com/ElodieBourgeois/


format:
  html:
    template-partials:
      - _partials/title-metadata.html
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles-dark.scss]
    toc: true
    toc-depth: 2

lang: fr
